<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Portföy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-bg">
        <div class="login-kart bg-white p-4 p-md-5 rounded-4 shadow-lg w-100" style="max-width:440px;">

            <!-- LOGO / BAŞLIK -->
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center
                            justify-content-center mb-3" style="width:70px; height:70px;">
                    <i class="bi bi-person-lock fs-2"></i>
                </div>
                <h3 class="fw-bold">Güvenli Giriş</h3>
                <p class="text-muted small">Öğrenci bilgilerinizle giriş yapın</p>
            </div>

            <!-- HATA ALANI -->
            <div id="jsHataAlani" class="alert alert-danger d-none" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span id="jsHataMetin"></span>
            </div>

            <!-- GİRİŞ FORMU -->
            <form id="loginForm" action="php/login-isle.php" method="POST" novalidate>

                <!-- KULLANICI ADI (mail) -->
                <div class="mb-3">
                    <label for="kullaniciAdi" class="form-label fw-medium">
                        <i class="bi bi-envelope me-1"></i>Kullanıcı Adı (E-posta)
                    </label>
                    <input type="email" class="form-control form-control-lg" id="kullaniciAdi" name="kullaniciAdi"
                        placeholder="b2312100035@sakarya.edu.tr" autocomplete="username">
                    <div class="form-text">Öğrenci numarası formatında e-posta</div>
                </div>

                <!-- ŞİFRE -->
                <div class="mb-4">
                    <label for="sifre" class="form-label fw-medium">
                        <i class="bi bi-lock me-1"></i>Şifre
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="sifre" name="sifre"
                            placeholder="Öğrenci numaranız" autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="sifreGoster"
                            title="Şifreyi göster/gizle">
                            <i class="bi bi-eye" id="sifreGozIcon"></i>
                        </button>
                    </div>
                    <div class="form-text">Şifreniz öğrenci numaranızdır (örn: b2312100035)</div>
                </div>

                <!-- BUTON -->
                <div class="d-grid">
                    <button type="button" class="btn btn-primary btn-lg" onclick="loginDogrula()">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
                    </button>
                </div>

            </form>

            <!-- GERİ DÖN -->
            <div class="text-center mt-4">
                <a href="index.html" class="text-muted text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i>Ana sayfaya dön
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ---- Şifre göster/gizle ----
        document.getElementById('sifreGoster').addEventListener('click', function () {
            const sifreInput = document.getElementById('sifre');
            const icon = document.getElementById('sifreGozIcon');
            if (sifreInput.type === 'password') {
                sifreInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                sifreInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // ---- Login JS Doğrulama ----
        function loginDogrula() {
            const hataAlani = document.getElementById('jsHataAlani');
            const hataMetin = document.getElementById('jsHataMetin');
            const kullaniciAdi = document.getElementById('kullaniciAdi').value.trim();
            const sifre = document.getElementById('sifre').value.trim();

            hataAlani.classList.add('d-none');
            document.getElementById('kullaniciAdi').classList.remove('is-invalid');
            document.getElementById('sifre').classList.remove('is-invalid');

            // Boş alan kontrolü
            if (!kullaniciAdi || !sifre) {
                hataMetin.textContent = 'Kullanıcı adı ve şifre boş bırakılamaz.';
                hataAlani.classList.remove('d-none');
                if (!kullaniciAdi) document.getElementById('kullaniciAdi').classList.add('is-invalid');
                if (!sifre) document.getElementById('sifre').classList.add('is-invalid');
                return;
            }

            // E-posta format kontrolü
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(kullaniciAdi)) {
                hataMetin.textContent = 'Geçerli bir e-posta adresi giriniz. (örn: b2312100035@sakarya.edu.tr)';
                hataAlani.classList.remove('d-none');
                document.getElementById('kullaniciAdi').classList.add('is-invalid');
                return;
            }

            // Sakarya edu formatı kontrolü (isteğe bağlı ek kontrol)
            if (!kullaniciAdi.endsWith('@sakarya.edu.tr')) {
                hataMetin.textContent = 'E-posta @sakarya.edu.tr uzantılı olmalıdır.';
                hataAlani.classList.remove('d-none');
                document.getElementById('kullaniciAdi').classList.add('is-invalid');
                return;
            }

            // Tüm kontroller geçtiyse formu gönder
            document.getElementById('loginForm').submit();
        }

        // Enter tuşu ile giriş
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loginDogrula();
        });

        // PHP yönlendirmesinden gelen ?hata= parametresini göster
        (function () {
            const params = new URLSearchParams(window.location.search);
            const hata = params.get('hata');
            if (hata) {
                const mesajlar = {
                    bos: 'Kullanıcı adı ve şifre boş bırakılamaz.',
                    mail: 'E-posta formatı hatalı. (örn: b2312100035@sakarya.edu.tr)',
                    yanlis: 'Kullanıcı adı veya şifre hatalı.'
                };
                const hataAlani = document.getElementById('jsHataAlani');
                document.getElementById('jsHataMetin').textContent = mesajlar[hata] || 'Bilinmeyen hata.';
                hataAlani.classList.remove('d-none');
            }
        })();
    </script>

</body>

</html>
